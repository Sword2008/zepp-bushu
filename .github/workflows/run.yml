name: 刷步数

on:
  schedule:
    - cron: '0 0,2,4,6,10,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检查 Secrets 配置
        env:
          CONFIG: ${{ secrets.CONFIG }}
          PAT: ${{ secrets.PAT }}
        run: |
          echo "────────────────── 配置预检 ──────────────────"
          if [ -z "$CONFIG" ]; then
            echo "❌ 未检测到 CONFIG Secret！"
            echo "   请在 Settings → Secrets and variables → Actions 添加 CONFIG"
            echo "   格式为严格 JSON，例如：{\"USER\":\"13800000000\",\"PWD\":\"密码\"}"
            exit 1
          fi
          if ! echo "$CONFIG" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "❌ CONFIG 不是合法 JSON！"
            echo "   请检查：字段和值必须用双引号，逗号不能多也不能少"
            exit 1
          fi
          echo "   ✅ CONFIG 已配置且 JSON 格式正确"
          if [ -z "$PAT" ]; then
            echo "❌ 未检测到 PAT Secret！"
            echo "   流程需要 PAT 用于 checkout 和自动提交，请按 README 第一步创建并添加"
            exit 1
          fi
          echo "   ✅ PAT 已配置"
          echo "   ⚠️ 若 PAT 已过期/权限不足，后面 checkout 或 push 会报 403，需重新生成"
          echo "────────────────── 预检结束 ──────────────────"

      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          # 判断 git status 是否有变化，有变动才执行 commit 和 push
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "persist tokens trigger by ${{ github.event_name }}"
            git push origin HEAD
          else
            echo "没有文件变动，跳过持久化提交。"
          fi
